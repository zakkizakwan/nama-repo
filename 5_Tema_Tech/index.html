<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">user@portfolio:~</span>
        </div>
        <div class="terminal-body">
            <div class="profile-row">
                <!-- ========================================================== -->
                <!-- 1. GANTI FOTO                                              -->
                <!-- 1. Masukkan file foto Anda ke dalam folder "foto"          -->
                <!-- 2. Ganti "foto-anda.jpg" dengan nama file foto Anda        -->
                <!-- ========================================================== -->
                <img src="foto/foto-anda.jpg" alt="Foto Profil" class="profile-img">
                <div class="info">
                    <h1><span class="prompt">$</span> whoami</h1>
                    <!-- ========================================================== -->
                    <!-- 2. GANTI NAMA                                              -->
                    <!-- Tulis nama Anda di antara tag <p> dan </p> di bawah        -->
                    <!-- ========================================================== -->
                    <p class="answer">Nama Anda Di Sini</p>
                    
                    <h2><span class="prompt">$</span> cat role.txt</h2>
                    <!-- ========================================================== -->
                    <!-- 3. GANTI PROFESI                                           -->
                    <!-- Tulis pekerjaan atau jurusan Anda di bawah ini             -->
                    <!-- ========================================================== -->
                    <p class="answer">Software Engineer</p>
                </div>
            </div>
            
            <div class="bio">
                <h3><span class="prompt">$</span> cat bio.txt</h3>
                <!-- ========================================================== -->
                <!-- 4. GANTI DESKRIPSI SINGKAT                                 -->
                <!-- Tulis sedikit tentang diri Anda di bawah ini               -->
                <!-- ========================================================== -->
                <p class="answer">Saya suka memecahkan masalah melalui kode. Selalu belajar teknologi baru dan membangun aplikasi yang bermanfaat.</p>
                <p class="cursor">_</p>
            </div>
        </div>
    </div>
</body>
</html>
