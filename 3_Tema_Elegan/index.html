<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Elegan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="profile-box">
            <!-- ========================================================== -->
            <!-- 1. GANTI FOTO                                              -->
            <!-- 1. Masukkan file foto Anda ke dalam folder "foto"          -->
            <!-- 2. Ganti "foto-anda.jpg" dengan nama file foto Anda        -->
            <!-- ========================================================== -->
            <img src="foto/foto-anda.jpg" alt="Foto Profil" class="profile-img">
            
            <!-- ========================================================== -->
            <!-- 2. GANTI NAMA                                              -->
            <!-- Tulis nama Anda di antara tag <h1> dan </h1>               -->
            <!-- ========================================================== -->
            <h1 class="name">Nama Lengkap Anda</h1>
            
            <div class="divider"></div>
            
            <!-- ========================================================== -->
            <!-- 3. GANTI PROFESI                                           -->
            <!-- Tulis pekerjaan atau jurusan Anda di bawah ini             -->
            <!-- ========================================================== -->
            <p class="profession">Fotografer / Seniman</p>
            
            <!-- ========================================================== -->
            <!-- 4. GANTI DESKRIPSI SINGKAT                                 -->
            <!-- Tulis sedikit tentang diri Anda di bawah ini               -->
            <!-- ========================================================== -->
            <p class="description">Menangkap momen melalui lensa dengan sentuhan klasik dan elegan.</p>
        </div>
    </div>
</body>
</html>
