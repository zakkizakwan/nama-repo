<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kreatif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="image-section">
            <!-- ========================================================== -->
            <!-- 1. GANTI FOTO                                              -->
            <!-- 1. Masukkan file foto Anda ke dalam folder "foto"          -->
            <!-- 2. Ganti "foto-anda.jpg" dengan nama file foto Anda        -->
            <!-- ========================================================== -->
            <img src="foto/foto-anda.jpg" alt="Foto Profil" class="profile-img">
        </div>
        <div class="text-section">
            <p class="greeting">Halo, panggil saja saya...</p>
            
            <!-- ========================================================== -->
            <!-- 2. GANTI NAMA                                              -->
            <!-- Tulis nama Anda di antara tag <h1> dan </h1>               -->
            <!-- ========================================================== -->
            <h1 class="name">Nama Anda</h1>
            
            <!-- ========================================================== -->
            <!-- 3. GANTI PROFESI                                           -->
            <!-- Tulis pekerjaan atau jurusan Anda di bawah ini             -->
            <!-- ========================================================== -->
            <h2 class="profession">Desainer Kreatif</h2>
            
            <!-- ========================================================== -->
            <!-- 4. GANTI DESKRIPSI SINGKAT                                 -->
            <!-- Tulis sedikit tentang diri Anda di bawah ini               -->
            <!-- ========================================================== -->
            <p class="description">Saya suka menciptakan hal-hal indah dan fungsional. Mari bekerja sama untuk membuat sesuatu yang luar biasa!</p>
        </div>
    </div>
</body>
</html>
